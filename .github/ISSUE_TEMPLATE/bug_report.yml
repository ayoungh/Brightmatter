name: Bug report
description: Report a reproducible problem with the template.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a problem.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest set of steps, code, or repository needed to reproduce the problem.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, browser, Node.js version, and pnpm version.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or other useful details. Remove secrets and private data.

  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
